<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKL東凑西凑的小題庫</title>
    
    <script>
        window.MathJax = {
            tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]']] },
            options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'] }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>

    <style>
        :root {
            --primary-color: #3498db;
            --success-color: #2ecc71;
            --warning-color: #e67e22;
            --danger-color: #e74c3c;
            --dark-color: #2c3e50;
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --border-color: #eef2f5;
            --purple-color: #9b59b6;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: var(--bg-color); color: var(--dark-color); line-height: 1.6; margin: 0; padding: 20px; }
        .container { max-width: 1300px; margin: 0 auto; }
        
        header { text-align: center; margin-bottom: 30px; background: linear-gradient(135deg, #2c3e50, #3498db); color: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        header h1 { margin: 0 0 15px 0; font-size: 28px; }

        .control-panel { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .search-panel { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .search-panel input { padding: 10px; border-radius: 6px; border: 1px solid #ccc; width: 300px; font-size: 14px; }

        .btn { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 5px; }
        .btn:hover { filter: brightness(0.9); }
        .btn-import { background-color: #7f8c8d; color: white; }
        .btn-export { background-color: #7f8c8d; color: white; }
        .btn-add-cat { background-color: var(--purple-color); color: white; }
        .btn-cloud-load { background-color: #2c3e50; color: white; border: 1px solid #fff; }
        .btn-cloud-sync { background-color: #f39c12; color: white; }
        
        .btn-add-q { background-color: var(--success-color); color: white; padding: 4px 10px; font-size: 13px; border-radius: 4px; }
        .btn-edit { background-color: var(--primary-color); color: white; padding: 5px 12px; font-size: 13px; }
        .btn-save { background-color: var(--success-color); color: white; padding: 5px 12px; font-size: 13px; }
        .btn-cancel { background-color: #95a5a6; color: white; padding: 5px 12px; font-size: 13px; }
        .btn-danger { background-color: var(--danger-color); color: white; padding: 5px 12px; font-size: 13px; }

        #file-input { display: none; }
        .main-layout { display: flex; gap: 30px; align-items: flex-start; }

        .sidebar-toc { width: 280px; background: var(--card-bg); padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); position: sticky; top: 20px; flex-shrink: 0; max-height: 85vh; overflow-y: auto; }
        .sidebar-toc h3 { margin-top: 0; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; font-size: 18px; }
        .toc-list { list-style: none; padding: 0; margin: 0; }
        .toc-list > li { margin-bottom: 12px; }
        .toc-list a { text-decoration: none; color: var(--dark-color); font-size: 15px; font-weight: bold; display: block; padding: 5px 8px; border-radius: 4px; transition: background 0.2s; }
        .toc-list a:hover { background-color: #e1f5fe; color: #0288d1; }
        .toc-sub-list { list-style: none; padding-left: 15px; margin: 5px 0 0 10px; border-left: 2px dashed #e0e0e0; }
        .toc-sub-list a { font-size: 13px; font-weight: normal; color: #555; padding: 4px 8px; }

        .content-area { flex-grow: 1; min-width: 0; }
        .category-header-container { display: flex; justify-content: space-between; align-items: center; border-left: 6px solid var(--primary-color); padding-left: 12px; margin: 30px 0 15px 0; padding-top: 10px; }
        .category-header-container:first-of-type { margin-top: 0; }
        .category-title { font-size: 24px; color: var(--dark-color); margin: 0; }
        .sub-category-title { font-size: 18px; color: #34495e; margin: 25px 0 15px 0; padding-left: 10px; border-left: 4px solid var(--warning-color); }

        .quiz-card { background-color: var(--card-bg); border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); transition: transform 0.2s; }
        .quiz-card.editing { border: 2px solid var(--warning-color); background-color: #fffdfb; }
        .card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; margin-bottom: 15px; }
        .card-title { font-weight: bold; font-size: 16px; display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
        
        .card-tag { background-color: #e1f5fe; color: #0288d1; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .diff-tag { font-weight: bold; } /* 難度標籤專用 */

        .edit-layout { display: flex; gap: 20px; }
        .edit-column { flex: 1; display: flex; flex-direction: column; }
        .edit-form label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 5px; color: #555; }
        .edit-form input[type="text"], .edit-form select { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .edit-form textarea { width: 100%; min-height: 250px; padding: 10px; font-family: monospace; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; resize: vertical; }
        
        .image-tools { margin-bottom: 15px; background: #f0f4f8; padding: 10px; border-radius: 6px; border: 1px solid #d0d7de; }
        
        .preview-box { border: 1px dashed var(--primary-color); background-color: #f8faff; padding: 15px; border-radius: 4px; min-height: 250px; overflow-x: auto; }
        .preview-box img, .card-body img { max-width: 100%; height: auto; display: block; margin: 10px 0; }
        .placeholder-text { text-align: center; color: #95a5a6; padding: 40px 0; font-size: 16px; }

        /* =========================================
           📱 手機端響應式適配 (Responsive Design)
           ========================================= */
        @media (max-width: 768px) {
            body { padding: 10px; }
            header { padding: 20px 10px; }
            header h1 { font-size: 22px; }
            
            .main-layout { flex-direction: column; gap: 15px; }
            
            .sidebar-toc { 
                width: 100%; 
                position: static; 
                max-height: 200px; 
                box-sizing: border-box; 
                margin-bottom: 10px;
                border: 2px solid var(--primary-color);
            }

            .edit-layout { flex-direction: column; gap: 15px; }
            .edit-form textarea { min-height: 180px; }
            .preview-box { min-height: auto; }
            
            .category-header-container { flex-direction: column; align-items: flex-start; gap: 10px; }
            .card-header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .card-header > div:last-child { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
            
            .search-panel input { width: 100%; box-sizing: border-box; }
            .control-panel { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; }
            .btn { flex: 1 1 calc(50% - 8px); min-width: 120px; justify-content: center; font-size: 13px; padding: 8px 10px; text-align: center; box-sizing: border-box; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>📐 嘟嘟可大冒險 <span style="font-size: 16px; background: rgba(0,0,0,0.2); padding: 4px 8px; border-radius: 20px;">咕咕嘎嘎</span></h1>
            <div class="control-panel">
                <button class="btn btn-cloud-load" onclick="loadFromGitHub()">☁️ 從雲端載入</button>
                <button class="btn btn-cloud-sync" onclick="saveToGitHub()">🚀 一鍵同步至雲端</button>
                <button class="btn btn-add-cat" onclick="addNewCategory()">➕ 新增主分類</button>
                <button class="btn btn-import" onclick="document.getElementById('file-input').click()">📥 本機匯入</button>
                <input type="file" id="file-input" accept=".json" onchange="handleFileLoad(event)">
                <button class="btn btn-export" onclick="exportJSON()">💾 本機匯出</button>
            </div>
            <div class="search-panel" id="search-panel" style="display: none;">
                <input type="text" id="search-input" placeholder="🔍 搜尋題目內容或 Tag..." onkeyup="filterQuestions()">
            </div>
        </header>

        <div class="main-layout">
            <aside class="sidebar-toc" id="sidebar-toc" style="display: none;">
                <h3>📋 目錄</h3>
                <ul class="toc-list" id="toc-list"></ul>
            </aside>

            <main class="content-area" id="quiz-container">
                <div class="placeholder-text">💡 歡迎使用！請點擊上方「☁️ 從雲端載入」開始管理題庫。</div>
            </main>
        </div>
    </div>

    <script>
        // ==========================================
        // 🚨 請在此修改為你的 GitHub 資訊 🚨
        // ==========================================
        const GITHUB_OWNER = "k835993725";      
        const GITHUB_REPO = "LKL_MATH";        
        const GITHUB_FILE_PATH = "update.json"; 

        let globalData = [];
        let hasUnsavedChanges = false;
        let mathJaxTimeout = null;

        // 離開頁面警告
        window.addEventListener('beforeunload', function (e) {
            if (hasUnsavedChanges) { e.preventDefault(); e.returnValue = ''; }
        });

        // ================= GitHub 雲端功能 =================
        async function loadFromGitHub() {
            try {
                const btn = document.querySelector('.btn-cloud-load');
                btn.innerText = "⏳ 載入中...";
                const url = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${GITHUB_FILE_PATH}?t=${new Date().getTime()}`;
                
                const response = await fetch(url);
                if (!response.ok) throw new Error("讀取失敗");
                
                globalData = await response.json();
                document.getElementById('search-panel').style.display = 'flex';
                document.getElementById('sidebar-toc').style.display = 'block';
                hasUnsavedChanges = false;
                renderPage();
                btn.innerText = "☁️ 從雲端載入";
                alert("☁️ 成功從 GitHub 載入最新題庫！");
            } catch (error) {
                document.querySelector('.btn-cloud-load').innerText = "☁️ 從雲端載入";
                alert(`❌ 載入失敗！請確認儲存庫是否為 Public。`);
            }
        }

        async function saveToGitHub() {
            if (globalData.length === 0) return alert("題庫為空，無法同步！");
            let savedToken = localStorage.getItem("GITHUB_PAT") || "";
            let token = prompt("請輸入你的 GitHub Personal Access Token (PAT)：", savedToken);
            if (!token) return;
            localStorage.setItem("GITHUB_PAT", token);

            const btn = document.querySelector('.btn-cloud-sync');
            btn.innerText = "⏳ 同步中...";

            try {
                const apiUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${GITHUB_FILE_PATH}`;
                let sha = "";
                const getRes = await fetch(apiUrl, { headers: { "Authorization": `token ${token}` } });
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                }

                const jsonString = JSON.stringify(globalData, null, 2);
                const encodedContent = btoa(unescape(encodeURIComponent(jsonString)));

                const updateRes = await fetch(apiUrl, {
                    method: "PUT",
                    headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        message: "透過題庫系統網頁自動更新",
                        content: encodedContent,
                        sha: sha || undefined
                    })
                });

                if (updateRes.ok) {
                    hasUnsavedChanges = false;
                    alert("✅ 成功同步！題庫已更新至 GitHub。");
                } else {
                    const errData = await updateRes.json();
                    throw new Error(errData.message);
                }
            } catch (error) {
                alert("❌ 同步失敗：" + error.message);
            } finally {
                btn.innerText = "🚀 一鍵同步至雲端";
            }
        }

        // ================= 本機操作功能 =================
        function handleFileLoad(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    globalData = JSON.parse(e.target.result);
                    document.getElementById('search-panel').style.display = 'flex';
                    document.getElementById('sidebar-toc').style.display = 'block';
                    hasUnsavedChanges = false;
                    renderPage();
                } catch (err) { alert("檔案格式錯誤！"); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function exportJSON() {
            if (globalData.length === 0) return alert("沒有資料可匯出！");
            const jsonString = JSON.stringify(globalData, null, 2);
            const blob = new Blob([jsonString], { type: "application/json;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = GITHUB_FILE_PATH;
            a.click(); URL.revokeObjectURL(url);
        }

        function addNewCategory() {
            const title = prompt("請輸入全新主分類標題：");
            if (!title || title.trim() === "") return;
            globalData.push({ categoryTitle: title.trim(), questions: [] });
            hasUnsavedChanges = true;
            renderPage();
            setTimeout(() => document.getElementById(`cat-${globalData.length-1}`).scrollIntoView(), 100);
        }

        function addNewQuestion(catIdx) {
            const category = globalData[catIdx];
            // 預設難度為 Lv3
            category.questions.push({ tag: "未分類", difficulty: "Lv3", content: "在此輸入題目。支援 HTML 與 MathJax \\( x^2 \\)." });
            hasUnsavedChanges = true;
            renderPage();
            enterEditMode(catIdx, category.questions.length - 1);
        }

        function deleteQuestion(catIdx, qIdx) {
            if (confirm("確定刪除此題嗎？")) { globalData[catIdx].questions.splice(qIdx, 1); hasUnsavedChanges = true; renderPage(); }
        }

        // ================= 介面渲染與編輯功能 =================
        function renderPage() {
            const container = document.getElementById('quiz-container');
            const tocList = document.getElementById('toc-list');
            const searchTerm = document.getElementById('search-input') ? document.getElementById('search-input').value.toLowerCase() : '';
            
            container.innerHTML = ''; tocList.innerHTML = '';
            if (globalData.length === 0) { container.innerHTML = '<div class="placeholder-text">💡 目前沒有資料。</div>'; return; }

            globalData.forEach((category, catIdx) => {
                const filteredQuestions = category.questions.filter(q => q.content.toLowerCase().includes(searchTerm) || q.tag.toLowerCase().includes(searchTerm));
                
                if (filteredQuestions.length > 0 || searchTerm === '') {
                    const catId = `cat-${catIdx}`;
                    const tocItem = document.createElement('li');
                    tocItem.innerHTML = `<a href="#${catId}">📂 ${category.categoryTitle}</a>`;
                    const tocSubList = document.createElement('ul'); tocSubList.className = 'toc-sub-list';

                    container.innerHTML += `<div class="category-header-container" id="${catId}">
                        <h2 class="category-title">${category.categoryTitle}</h2>
                        <button class="btn btn-add-q" onclick="addNewQuestion(${catIdx})">➕ 新增題目</button>
                    </div>`;

                    const qByTag = {};
                    filteredQuestions.forEach(q => { const t = q.tag || '未分類'; if(!qByTag[t]) qByTag[t]=[]; qByTag[t].push(q); });

                    Object.keys(qByTag).forEach((tag, tagIdx) => {
                        const tagId = `cat-${catIdx}-tag-${tagIdx}`;
                        tocSubList.innerHTML += `<li><a href="#${tagId}">🏷️ ${tag} (${qByTag[tag].length})</a></li>`;
                        container.innerHTML += `<h3 class="sub-category-title" id="${tagId}">🏷️ ${tag}</h3>`;
                        
                        qByTag[tag].forEach(q => {
                            const origIdx = category.questions.indexOf(q);
                            
                            // 判斷難度顏色 (舊 JSON 若無難度，預設以 Lv3 處理顯示)
                            const diff = q.difficulty || "Lv3";
                            let diffColor = "#3498db"; // 預設藍色 Lv3
                            if(diff === "Lv2") diffColor = "#2ecc71"; // 綠色
                            if(diff === "Lv4") diffColor = "#9b59b6"; // 紫色
                            if(diff === "Lv5") diffColor = "#e74c3c"; // 紅色

                            container.innerHTML += `
                                <div class="quiz-card" id="card-${catIdx}-${origIdx}">
                                    <div class="card-header">
                                        <div class="card-title">
                                            <span>第 ${origIdx + 1} 題</span>
                                            <span class="card-tag diff-tag" style="background-color: ${diffColor}; color: white;">⭐ ${diff}</span>
                                            <span class="card-tag">${q.tag}</span>
                                        </div>
                                        <button class="btn btn-edit" onclick="enterEditMode(${catIdx}, ${origIdx})">✏️ 編輯</button>
                                    </div>
                                    <div class="card-body">${q.content}</div>
                                </div>`;
                        });
                    });
                    tocItem.appendChild(tocSubList); tocList.appendChild(tocItem);
                }
            });
            triggerMathJax();
        }

        function filterQuestions() { renderPage(); }

        function enterEditMode(catIdx, qIdx) {
            const card = document.getElementById(`card-${catIdx}-${qIdx}`);
            const q = globalData[catIdx].questions[qIdx];
            const currentCatTitle = globalData[catIdx].categoryTitle; 
            
            // 讀取當前難度，若無則預設為 Lv3
            const currentDiff = q.difficulty || "Lv3";

            card.classList.add('editing');
            card.innerHTML = `
                <div class="card-header">
                    <div class="card-title" style="color:var(--warning-color)">⚠️ 編輯中 (第 ${qIdx + 1} 題)</div>
                    <div>
                        <button class="btn btn-save" onclick="saveQuestion(${catIdx}, ${qIdx})">💾 儲存變更</button>
                        <button class="btn btn-danger" onclick="deleteQuestion(${catIdx}, ${qIdx})">🗑️ 刪除題目</button>
                        <button class="btn btn-cancel" onclick="renderPage()">❌ 取消</button>
                    </div>
                </div>
                <div class="edit-layout">
                    <div class="edit-column edit-form">
                        <label style="color: var(--purple-color);">📁 修改主分類名稱:</label>
                        <input type="text" id="input-cat-title-${catIdx}-${qIdx}" value="${currentCatTitle}" style="border: 1px solid var(--purple-color); background: #fdfaff;">

                        <div style="display: flex; gap: 10px;">
                            <div style="flex: 1;">
                                <label>⭐ 難度等級:</label>
                                <select id="input-diff-${catIdx}-${qIdx}">
                                    <option value="Lv2" ${currentDiff === 'Lv2' ? 'selected' : ''}>Lv2 (基礎 / 綠)</option>
                                    <option value="Lv3" ${currentDiff === 'Lv3' ? 'selected' : ''}>Lv3 (一般 / 藍)</option>
                                    <option value="Lv4" ${currentDiff === 'Lv4' ? 'selected' : ''}>Lv4 (進階 / 紫)</option>
                                    <option value="Lv5" ${currentDiff === 'Lv5' ? 'selected' : ''}>Lv5 (挑戰 / 紅)</option>
                                </select>
                            </div>
                            <div style="flex: 1;">
                                <label>🏷️ 標籤 (Tag):</label>
                                <input type="text" id="input-tag-${catIdx}-${qIdx}" value="${q.tag}">
                            </div>
                        </div>
                        
                        <div class="image-tools">
                            <label>🖼️ 插入圖片轉 Base64:</label>
                            <input type="file" accept="image/*" onchange="handleImageUpload(event, ${catIdx}, ${qIdx})">
                        </div>
                        <label>📝 題目內容源碼:</label>
                        <textarea id="input-content-${catIdx}-${qIdx}" oninput="updateLivePreview(${catIdx}, ${qIdx})"></textarea>
                    </div>
                    <div class="edit-column">
                        <label>👀 即時預覽:</label>
                        <div id="preview-box-${catIdx}-${qIdx}" class="preview-box">${q.content}</div>
                    </div>
                </div>`;
            document.getElementById(`input-content-${catIdx}-${qIdx}`).value = q.content;
            triggerMathJax(document.getElementById(`preview-box-${catIdx}-${qIdx}`));
        }

        function handleImageUpload(event, catIdx, qIdx) {
            const file = event.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const textarea = document.getElementById(`input-content-${catIdx}-${qIdx}`);
                const imgTag = `\\n<img src="${e.target.result}" alt="圖片" />\\n`;
                const s = textarea.selectionStart, end = textarea.selectionEnd;
                textarea.value = textarea.value.substring(0, s) + imgTag + textarea.value.substring(end);
                updateLivePreview(catIdx, qIdx);
            };
            reader.readAsDataURL(file);
        }

        function updateLivePreview(catIdx, qIdx) {
            clearTimeout(mathJaxTimeout);
            const box = document.getElementById(`preview-box-${catIdx}-${qIdx}`);
            box.innerHTML = document.getElementById(`input-content-${catIdx}-${qIdx}`).value;
            mathJaxTimeout = setTimeout(() => triggerMathJax(box), 500);
        }

        function saveQuestion(catIdx, qIdx) {
            const newCatTitle = document.getElementById(`input-cat-title-${catIdx}-${qIdx}`).value.trim();
            if (newCatTitle !== "") {
                globalData[catIdx].categoryTitle = newCatTitle;
            }

            // 儲存難度與標籤
            globalData[catIdx].questions[qIdx].difficulty = document.getElementById(`input-diff-${catIdx}-${qIdx}`).value;
            globalData[catIdx].questions[qIdx].tag = document.getElementById(`input-tag-${catIdx}-${qIdx}`).value.trim() || "未分類";
            globalData[catIdx].questions[qIdx].content = document.getElementById(`input-content-${catIdx}-${qIdx}`).value;
            hasUnsavedChanges = true; 
            renderPage();
        }

        function triggerMathJax(el = null) {
            if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise(el ? [el] : null);
        }
    </script>
</body>
</html>
